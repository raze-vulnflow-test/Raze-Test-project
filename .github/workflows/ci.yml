# CI: VulnFlow DevSecOps (code, secrets, dependencies) and the VulnFlow SCA gate (what the build ships)
# on every push to main and every pull request. A push to main deploys only when both pass.
# DevSecOps uses the organisation secret VULNFLOW_ORG_KEY; the SCA gate uses the repository secret
# VULNFLOW_API_KEY and the central workflow in raze-vulnflow-test/security-workflows.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  vulnflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VulnFlow DevSecOps scan
        env:
          VULNFLOW_URL: https://demo.vulnflow.com
          VULNFLOW_KEY: ${{ secrets.VULNFLOW_ORG_KEY }}
          VULNFLOW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -fsS "$VULNFLOW_URL/api/dast/devsecops/pipeline/script" -o vulnflow-devsecops.sh
          bash vulnflow-devsecops.sh

  sca-gate:
    # id-token: write lets the gate prove to VulnFlow that it is the organisation's central workflow.
    permissions:
      contents: read
      id-token: write
    uses: raze-vulnflow-test/security-workflows/.github/workflows/vulnflow-gate.yml@main
    secrets:
      VULNFLOW_API_KEY: ${{ secrets.VULNFLOW_API_KEY }}

  deploy:
    name: Deploy to staging
    needs: [vulnflow, sca-gate]   # both gates: a failed one leaves the deploy skipped
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t raze-test-project:${GITHUB_SHA::7} .
      - name: Deploy (simulated)
        run: echo "Deployed raze-test-project:${GITHUB_SHA::7} to staging"
