# VulnFlow SCA gate - this repository's part of it.
#
# The gate itself lives in raze-vulnflow-test/security-workflows and is the same for every repository that
# calls it. This file only calls it, and makes the deploy wait for its answer.
#
# `needs: sca-gate` on the deploy job is the line that matters: without it the
# gate runs, judges, and stops nothing.
name: Deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sca-gate:
    # id-token: write lets the gate prove to VulnFlow that it is the
    # organisation's central workflow running for this repository. Without it the
    # call is unverified and cannot replace the inventory or clear a deployment.
    permissions:
      contents: read
      id-token: write
    uses: raze-vulnflow-test/security-workflows/.github/workflows/vulnflow-gate.yml@main
    secrets:
      VULNFLOW_API_KEY: ${{ secrets.VULNFLOW_API_KEY }}
    # To judge this repository MORE strictly than the organisation:
    # with:
    #   max_high: '0'
    # Looser than the organisation is refused; that takes an exception
    # in the central workflow.

  deploy:
    name: Deploy to production
    needs: sca-gate          # <- the gate. A failed one leaves this skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ── placeholder. Put the real deploy here. ──
      - run: echo "Deploy here."
